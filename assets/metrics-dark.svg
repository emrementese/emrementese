<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180" role="img" aria-label="GitHub metrics card">
  <rect x="0.5" y="0.5" width="839" height="179" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="44" cy="52" r="11" fill="none" stroke="#1F6FEB" stroke-width="2.5"/>
  <path d="M44 45.5v7l4.5 2.5" fill="none" stroke="#1F6FEB" stroke-width="2.5" stroke-linecap="round"/>
  <text x="70" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">GitHub metrics</text>
  <text x="70" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">Generated daily by the Metrics workflow and committed to this repository.</text>
  <text x="70" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#8b949e">Add the <tspan font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1F6FEB">METRICS_TOKEN</tspan> repository secret to activate it.</text>
