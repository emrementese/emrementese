# Regenerates the Open Source Stats card into assets/ once a day.
#
# The README references the output by relative path, so the card has no
# render-time dependency on any third-party service.
#
# No personal access token is needed: the built-in GITHUB_TOKEN can read the
# public repository and sponsor counts this card shows.

name: Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml
      - scripts/open_source_stats.py

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: emrementese
        run: python3 scripts/open_source_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update Open Source Stats card [skip ci]"
          git push
