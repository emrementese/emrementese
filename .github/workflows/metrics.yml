# Generates the GitHub statistics cards as SVGs committed into `assets/`.
#
# Why self-hosted: the README references these by RELATIVE PATH, so the main
# stats card has zero render-time dependency on a third-party service. The
# public github-readme-stats instance this repo used to rely on is permanently
# paused (HTTP 503 DEPLOYMENT_PAUSED), which is what broke the old README.
#
# REQUIRED SETUP (one time, manual):
#   Create repo secret METRICS_TOKEN = a classic PAT with scopes:
#     - public_repo
#     - read:user
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
# Until that secret exists, these steps fail and the committed placeholder
# SVGs in assets/ remain in place (so the README never shows a broken image).

name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics (dark)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrementese
          filename: assets/metrics-dark.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          extras_css: |
            :root { --color-text: #c9d1d9; --color-calm: #8b949e; --color-highlight: #1F6FEB; }
            body, .background { background: #0d1117 !important; }
            svg { background: #0d1117 !important; }
            h1, h2, h3, .title, .value, .name, text { color: #c9d1d9 !important; fill: #c9d1d9 !important; }
            .field, .key, .subtitle, .description, .muted { color: #8b949e !important; fill: #8b949e !important; }
            a, .link { color: #1F6FEB !important; fill: #1F6FEB !important; }
            section, .row, .cell { border-color: #30363d !important; }

      - name: Metrics (light)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrementese
          filename: assets/metrics-light.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Istanbul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          extras_css: |
            :root { --color-text: #1f2328; --color-calm: #59636e; --color-highlight: #0969DA; }
            body, .background { background: #ffffff !important; }
            svg { background: #ffffff !important; }
            h1, h2, h3, .title, .value, .name, text { color: #1f2328 !important; fill: #1f2328 !important; }
            .field, .key, .subtitle, .description, .muted { color: #59636e !important; fill: #59636e !important; }
            a, .link { color: #0969DA !important; fill: #0969DA !important; }
            section, .row, .cell { border-color: #d0d7de !important; }
